name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 🧪 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚡ Deploy to VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: rafshandev
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VITE_API_BASE_URL
          script: |
            cd /home/MedVoice 
            chmod +x deploy.sh
            ./deploy.sh
